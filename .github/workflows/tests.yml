# Builds Onyx and runs the self-tests that don't need Apple's on-device AI, on GitHub's Mac machines.
# The full suite (including the AI tests) still runs on a Mac with Apple Intelligence: ./test.sh

name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build (Apple silicon half)
        run: |
          export ONYX_SDK="$(xcrun --show-sdk-path)" ONYX_ARM_ONLY=1
          ./build.sh

      - name: Run the tests
        run: ./test.sh --no-build --no-apple-ai

      - name: Summarize
        if: always()
        run: |
          for f in /tmp/onyx-tests.*/*.log; do
            echo "::notice title=$(basename "$f")::$(grep -c '^PASS' "$f") passed, $(grep -c '^FAIL' "$f") failed"
            grep '^FAIL' "$f" | head -5 | while read -r line; do echo "::error title=$(basename "$f")::$line"; done
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/onyx-tests.*/*.log
